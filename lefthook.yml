# Lefthook configuration - faster alternative to Husky + lint-staged
# https://github.com/evilmartians/lefthook

pre-commit:
  jobs:
    # Ordered, not parallel: the fixers rewrite staged files, so they must all
    # finish before typecheck reads them.
    - name: fix
      group:
        piped: true
        jobs:
          - name: lint
            glob: '*.{ts,tsx}'
            run: npx eslint --fix --no-warn-ignored {staged_files}
            stage_fixed: true
          - name: format-code
            glob: '*.{ts,tsx}'
            run: npx prettier --write {staged_files}
            stage_fixed: true
          - name: format-other
            glob: '*.{json,md,yaml,yml}'
            run: npx prettier --write {staged_files}
            stage_fixed: true
    - name: typecheck
      # --no-renames so a rename is gated as both its old and its new path, and
      # the list is read here rather than from {files} because lefthook drops
      # paths that no longer exist on disk - exactly the deletions this gates.
      run: |
        files=$(git diff --cached --name-only --no-renames | paste -sd, -)
        [ -n "$files" ] || exit 0
        NX_DAEMON=false npx nx affected -t typecheck --files="$files" --output-style=stream
      skip:
        - merge
        - rebase
    - name: check-migrations
      glob:
        - 'apps/api/src/database/schema/**/*.ts'
        - 'packages/shared/types/src/lib/ai.types.ts'
      run: |
        npx nx db:generate api --no-cloud 2>/dev/null
        if ! git diff --exit-code -- apps/api/drizzle/ > /dev/null 2>&1; then
          echo "Auto-generated migration for schema changes."
          git add apps/api/drizzle/
        fi
      stage_fixed: true
      skip:
        - merge
        - rebase

pre-push:
  commands:
    test:
      run: NX_DAEMON=false npx nx affected -t test --base=origin/main --head=HEAD --output-style=stream
      skip:
        - merge
        - rebase

commit-msg:
  commands:
    conventional:
      # Validate conventional commit format
      run: |
        message=$(cat {1})
        if ! echo "$message" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+"; then
          echo "Error: Commit message must follow Conventional Commits format"
          echo "Example: feat(auth): add login functionality"
          exit 1
        fi
