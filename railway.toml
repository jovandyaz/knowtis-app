# Railway Configuration for Knowtis API
# https://docs.railway.com/guides/config-as-code

[build]
# Build command for NestJS API in Nx monorepo
builder = "nixpacks"
buildCommand = "NODE_ENV=development pnpm install --frozen-lockfile && pnpm build:api"
# Nx affected is the first CI gate, but Railway still evaluates watchPatterns
# against the uploaded snapshot and records SKIPPED when none match.
watchPatterns = ["apps/api/**", "libs/**", "package.json", "pnpm-lock.yaml", "railway.toml"]

[deploy]
# Single source of truth for DB migrations: runs in the release environment
# (same DATABASE_URL/network as the app) and aborts the deploy on non-zero exit,
# so the new code never serves against an un-migrated schema. See docs/MIGRATIONS.md.
preDeployCommand = "pnpm exec tsx apps/api/src/database/migrate.ts"
# Start command for the API
startCommand = "node dist/apps/api/main.js"
healthcheckPath = "/api/v1/health/ping"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
# Default environment variables
NODE_ENV = "production"
PORT = "3333"
