packages:
  - 'apps/*'
  - 'libs/*'
  - 'libs/data-access/*'
  - 'packages/*'

# 3 days; Renovate's npm cooldown does not reach pnpm's transitive resolution.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@10.34.5
  - pnpm@10.34.5
  # Renovate security update: @tiptap/core@3.30.4
  - "@tiptap/core@3.30.4"
