name: Weekly Evals

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # actions: read lets the drift step download an earlier run's artifact.
  actions: read

concurrency:
  group: weekly-evals
  cancel-in-progress: false

jobs:
  resolve:
    name: Served platform models
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fast: ${{ steps.read.outputs.fast }}
      balanced: ${{ steps.read.outputs.balanced }}
      powerful: ${{ steps.read.outputs.powerful }}
    steps:
      - id: read
        env:
          KNOWTIS_API_URL: ${{ secrets.KNOWTIS_API_URL }}
          MODEL_GATE_TOKEN: ${{ secrets.MODEL_GATE_TOKEN }}
        run: |
          if [ -z "$KNOWTIS_API_URL" ] || [ -z "$MODEL_GATE_TOKEN" ]; then
            echo "::notice::KNOWTIS_API_URL or MODEL_GATE_TOKEN is not set; the legs evaluate the repository variables or the seeds."
            exit 0
          fi
          if ! body=$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $MODEL_GATE_TOKEN" \
            "$KNOWTIS_API_URL/api/v1/internal/model-gate/active"); then
            echo "::warning::Could not read the served models; the legs evaluate the repository variables or the seeds."
            exit 0
          fi
          if ! jq -e 'type == "object"' >/dev/null 2>&1 <<<"$body"; then
            echo "::warning::The served models are not a JSON object; the legs evaluate the repository variables or the seeds."
            exit 0
          fi
          for intent in fast balanced powerful; do
            model=$(jq -r --arg intent "$intent" '.[$intent] | strings | select(test("^[a-z0-9-]+:[A-Za-z0-9._/:-]+\\z"))' <<<"$body")
            if [ -z "$model" ]; then
              echo "::warning::No valid served model for $intent; its legs evaluate the repository variable or the seed."
            fi
            echo "$intent=$model" >> "$GITHUB_OUTPUT"
          done

  evals:
    name: AI Evals (${{ matrix.leg }})
    needs: resolve
    runs-on: ubuntu-latest
    # Above the 50-minute vitest budget of a ten-trial suite, so a hung turn
    # fails inside vitest and the leg still uploads its results.
    timeout-minutes: 75
    strategy:
      # Each leg is evidence about a different model; one red leg must not hide the rest.
      fail-fast: false
      matrix:
        # The production legs evaluate what prod serves (the resolve job), then
        # the AI_EVAL_*_MODEL repository variables, then the seeded platform
        # resolutions (migration 0060).
        include:
          - leg: reference
            model: anthropic:claude-sonnet-5
            target: eval
            trials: 3
          - leg: default-model
            model: ${{ needs.resolve.outputs.balanced || vars.AI_EVAL_DEFAULT_MODEL || 'openrouter:deepseek/deepseek-v3.2' }}
            target: eval
            trials: 3
          - leg: default-model-security
            model: ${{ needs.resolve.outputs.balanced || vars.AI_EVAL_DEFAULT_MODEL || 'openrouter:deepseek/deepseek-v3.2' }}
            target: eval-security
            trials: 10
          - leg: fast-model-security
            model: ${{ needs.resolve.outputs.fast || vars.AI_EVAL_FAST_MODEL || 'openrouter:minimax/minimax-m2.5' }}
            target: eval-security
            trials: 10
          - leg: deep-model-security
            model: ${{ needs.resolve.outputs.powerful || vars.AI_EVAL_DEEP_MODEL || 'openrouter:moonshotai/kimi-k2.5' }}
            target: eval-security
            trials: 10
    services:
      postgres:
        # pgvector image: migrations create the `vector` extension for embeddings.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowtis_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/knowtis_eval
      # Throwaway values: the harness validates env shape only, never issues real tokens.
      JWT_SECRET: nightly-eval-jwt-secret-0000000000000000
      JWT_REFRESH_SECRET: nightly-eval-jwt-refresh-secret-11111111
      TOKEN_HASH_KEY: bmlnaHRseS1ldmFsLXRva2VuLWhhc2gta2V5LTMyYiE=
      # Attack success is a rate: an attack that lands one time in ten reads green
      # 73% of weeks at three trials and 35% at ten. Ten narrows the gap, it does
      # not close it. Behavior cases fail below a 2/3 pass rate.
      AI_EVAL_TRIALS: ${{ matrix.trials }}
      AI_EVAL_MODEL: ${{ matrix.model }}
      AI_EVAL_OUTPUT_DIR: ${{ github.workspace }}/eval-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Fail fast if a provider key is missing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEEDS_OPENROUTER: ${{ startsWith(matrix.model, 'openrouter:') }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set — every eval would silently skip, and the rubric judge needs it on every leg."
            exit 1
          fi
          if [ "$NEEDS_OPENROUTER" = "true" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not set — this leg pins an OpenRouter model."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: npx nx db:migrate:run api

      - name: Run AI evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # The reference leg keeps the environment it has always had, so its
          # time series stays comparable and its fallback chain stays empty.
          OPENROUTER_API_KEY: ${{ startsWith(matrix.model, 'openrouter:') && secrets.OPENROUTER_API_KEY || '' }}
          EVAL_TARGET: ${{ matrix.target }}
        run: npx nx run "api:$EVAL_TARGET"

      - name: Compare against the previous run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVAL_DRIFT_ARTIFACT_NAME: eval-results-${{ matrix.leg }}
        run: .github/scripts/eval-drift.sh

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-results-${{ matrix.leg }}
          path: eval-results
          retention-days: 90
          # A leg without results is a leg that graded nothing; never let it pass.
          if-no-files-found: error
