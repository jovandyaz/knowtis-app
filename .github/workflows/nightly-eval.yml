name: Nightly Evals

on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC daily (~02:00 America/Mexico_City)
  workflow_dispatch:

concurrency:
  group: nightly-evals
  cancel-in-progress: false

jobs:
  evals:
    name: AI Evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # pgvector image: migrations create the `vector` extension for embeddings.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowtis_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/knowtis_eval
      # Throwaway secrets: the eval harness only validates env shape (length,
      # distinctness) and never issues or verifies real tokens.
      JWT_SECRET: nightly-eval-jwt-secret-0000000000000000
      JWT_REFRESH_SECRET: nightly-eval-jwt-refresh-secret-11111111
      # Each eval self-skips when its provider key is absent; only the
      # Anthropic-gated suites (injection-guard, copilot) run by default.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Fail fast if the Anthropic key is missing
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set — every eval would silently skip."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: npx nx db:migrate:run api

      - name: Run AI evals
        run: npx nx eval api
