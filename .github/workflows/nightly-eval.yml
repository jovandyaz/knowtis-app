name: Nightly Evals

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # actions: read lets the drift step download the previous nightly's artifact.
  actions: read

concurrency:
  group: nightly-evals
  cancel-in-progress: false

jobs:
  evals:
    name: AI Evals
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        # pgvector image: migrations create the `vector` extension for embeddings.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowtis_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/knowtis_eval
      # Throwaway values: the harness validates env shape only, never issues real tokens.
      JWT_SECRET: nightly-eval-jwt-secret-0000000000000000
      JWT_REFRESH_SECRET: nightly-eval-jwt-refresh-secret-11111111
      TOKEN_HASH_KEY: bmlnaHRseS1ldmFsLXRva2VuLWhhc2gta2V5LTMyYiE=
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      # Multi-trial: each promptfoo case runs 3 times; a case fails below a 2/3 pass rate.
      AI_EVAL_TRIALS: '3'
      AI_EVAL_OUTPUT_DIR: ${{ github.workspace }}/eval-results
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Fail fast if the Anthropic key is missing
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set — every eval would silently skip."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: npx nx db:migrate:run api

      - name: Run AI evals
        run: npx nx eval api

      - name: Compare against previous nightly
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/eval-drift.sh

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-results
          path: eval-results
          retention-days: 90
          if-no-files-found: warn
