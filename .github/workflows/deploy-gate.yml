# The gate decides whether a prod deploy is trusted, so its changes cannot rely
# on a run-it-by-hand convention: this runs the harness in the same image the
# real deploy uses.
name: Deploy Gate Tests

on:
  push:
    branches: [main]
    paths: ['.github/scripts/**']
  pull_request:
    paths: ['.github/scripts/**']

permissions:
  contents: read

jobs:
  gate-harness:
    name: Railway deploy gate harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run harness in the Railway CLI image
        run: |
          docker run --rm -v "$PWD/.github/scripts:/s" --entrypoint sh \
            ghcr.io/railwayapp/cli@sha256:61856c5b02d19d154ee35d7b36a263ce81cc7bf82c5e130a06a4b3f69ca88d7f /s/railway-deploy.test.sh
