name: Railway config

# Plans .railway/railway.ts on pull requests and applies the reviewed, pinned
# plan when the PR merges. The plan job is hand-rolled because
# railwayapp/config's plan mode runs `npm install` on the repo, which this
# pnpm workspace cannot tolerate; it uploads the same `railway-plan` artifact
# the action's apply mode looks up by PR head SHA, so what was reviewed is
# what lands (change set + environment etag + .railway/ tree). Destructive
# changes are refused here; an intended deletion is applied locally with
# `railway config apply --confirm-destructive` after review.
# Only pull requests against main trigger this: a direct push to main that
# touches .railway/ is never applied, so the environment silently drifts from
# the file until the next PR plans it. Branch protection keeps that path closed.
# RAILWAY_TOKEN is a project token with configuration access. The plan job
# evaluates PR-controlled .railway/railway.ts with it, so only same-repository
# PRs (write access already) plan; the token is scoped to the plan step, not
# the job, so dependency install scripts never see it.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - '.railway/**'

permissions:
  contents: read

env:
  # renovate: datasource=npm depName=@railway/cli
  RAILWAY_CLI_VERSION: 5.49.0

jobs:
  plan:
    name: Plan
    if: github.event.action != 'closed' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck the configuration
        # `railway config plan` strips types instead of checking them; a type
        # error would otherwise reach the plan as a runtime failure.
        run: pnpm exec tsc --noEmit --strict --module nodenext --moduleResolution nodenext --target es2022 --skipLibCheck .railway/railway.ts
      - name: Plan
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: pnpm dlx @railway/cli@${{ env.RAILWAY_CLI_VERSION }} config plan --out railway-plan.json | tee plan.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: railway-plan
          path: railway-plan.json
      - name: Comment plan
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const plan = JSON.parse(fs.readFileSync('railway-plan.json', 'utf8'));
            const text = fs.readFileSync('plan.txt', 'utf8').trimEnd();
            const changes = Array.isArray(plan.changeSet?.changes) ? plan.changeSet.changes.length : 0;
            const summary = changes === 0
              ? 'No changes: the environment already matches `.railway/`.'
              : `**${changes} change${changes === 1 ? '' : 's'}** will apply on merge.`;
            const body = [
              '<!-- railway-config-plan -->',
              '### Railway config plan',
              '',
              summary,
              '',
              '```',
              text,
              '```',
              '',
              plan.destructive ? '> [!WARNING]\n> This plan is destructive; the merge apply will refuse it.' : '',
              `Pinned: tree \`${plan.sourceTree}\`, etag \`${plan.configEtag}\`, change-set \`${plan.changeSetHash}\`. If the environment or \`.railway/\` moves first, the apply fails and the PR needs a fresh plan.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const existing = (await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 })).data
              .find((c) => c.body?.startsWith('<!-- railway-config-plan -->'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    name: Apply
    if: github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1
        with:
          command: apply
          cli-version: ${{ env.RAILWAY_CLI_VERSION }}
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          confirm-destructive: false
