name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # renovate: datasource=npm depName=vercel
  VERCEL_CLI_VERSION: 59.15.1
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.30.1

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        # pgvector image: migrations create the `vector` extension for embeddings.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowtis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://127.0.0.1:6379
      SHARING_PROBE_REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/knowtis_test
      # Throwaway values: specs validate env shape only, they never issue real tokens.
      JWT_SECRET: ci-jwt-secret-0000000000000000000000
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-1111111111111111
      # Required in every environment, so the db specs that boot ConfigModule
      # need it here — there is no .env on a runner to supply it. 32 bytes base64.
      TOKEN_HASH_KEY: Y2ktdGhyb3dhd2F5LXRva2VuLWhhc2gta2V5LTMyYiE=
    outputs:
      api_affected: ${{ steps.affected.outputs.api }}
      notes_affected: ${{ steps.affected.outputs.notes }}
      mcp_affected: ${{ steps.affected.outputs.mcp }}
      backoffice_affected: ${{ steps.affected.outputs.backoffice }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: tree:0

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5
        with:
          main-branch-name: main

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify vendored agent skills
        run: pnpm skills:check

      - name: Verify ESLint config resolves per project
        run: pnpm lint:config

      - name: Audit workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run "zizmor==$ZIZMOR_VERSION" .github/workflows/

      - name: Lint (affected)
        run: npx nx affected -t lint

      - name: Typecheck (affected)
        run: npx nx affected -t typecheck

      - name: Check for missing DB migrations
        run: |
          npx nx db:generate api
          if [ -n "$(git status --porcelain --untracked-files=all -- apps/api/drizzle/)" ]; then
            echo "::error::Schema changes detected without a corresponding migration file."
            echo "::error::Run 'pnpm nx db:generate api' locally and commit the generated files."
            git status --short --untracked-files=all -- apps/api/drizzle/
            exit 1
          fi

      - name: Apply migrations
        run: npx nx db:migrate:run api

      - name: Test (affected)
        # --parallel=2 bounds concurrent vitest projects; 3+ NestJS/jsdom
        # suites at once exceed hosted-runner memory and get OOM-killed.
        # Streamed output survives a killed child; nx's buffered default
        # truncates mid-line and loses the vitest summary that names the failure.
        run: npx nx affected -t test --parallel=2 --outputStyle=stream -- --run

      - name: Build (affected)
        run: npx nx affected -t build --configuration=production

      - name: Detect affected deploy targets
        id: affected
        run: |
          affected="$(npx nx show projects --affected)"
          for project in api notes mcp backoffice notes-e2e; do
            if printf '%s\n' "$affected" | grep -qx "$project"; then value=true; else value=false; fi
            echo "${project//-/_}=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Install Chromium for sharing acceptance
        if: steps.affected.outputs.notes_e2e == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Sharing acceptance against production builds
        if: steps.affected.outputs.notes_e2e == 'true'
        timeout-minutes: 15
        # Own Compose project and ports; setup strips inherited service credentials.
        run: npx nx e2e notes-e2e

      - name: Upload sharing acceptance evidence
        if: always() && steps.affected.outputs.notes_e2e == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sharing-acceptance
          path: |
            dist/.playwright/apps/notes-e2e/
            dist/.playwright/sharing-runtime/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.ci.outputs.notes_affected == 'true'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Pull Vercel environment
        run: pnpm dlx "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: pnpm dlx "vercel@$VERCEL_CLI_VERSION" build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: pnpm dlx "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-backoffice:
    name: Deploy Backoffice to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.ci.outputs.backoffice_affected == 'true'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKOFFICE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Pull Vercel environment
        run: pnpm dlx "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: pnpm dlx "vercel@$VERCEL_CLI_VERSION" build --prod --local-config=apps/backoffice/vercel.json --token="$VERCEL_TOKEN"

      - name: Deploy
        run: pnpm dlx "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --local-config=apps/backoffice/vercel.json --token="$VERCEL_TOKEN"

  deploy:
    name: Deploy API to Railway
    runs-on: ubuntu-latest
    needs: [ci]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.ci.outputs.api_affected == 'true'
    container: ghcr.io/railwayapp/cli:latest@sha256:61856c5b02d19d154ee35d7b36a263ce81cc7bf82c5e130a06a4b3f69ca88d7f
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Deploy to Railway
        run: sh .github/scripts/railway-deploy.sh "$RAILWAY_API_SERVICE_ID"

  deploy-mcp:
    name: Deploy MCP to Railway
    runs-on: ubuntu-latest
    needs: [ci]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.ci.outputs.mcp_affected == 'true' &&
      vars.RAILWAY_MCP_SERVICE_ID != ''
    container: ghcr.io/railwayapp/cli:latest@sha256:61856c5b02d19d154ee35d7b36a263ce81cc7bf82c5e130a06a4b3f69ca88d7f
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_MCP_SERVICE_ID: ${{ vars.RAILWAY_MCP_SERVICE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Assert OAuth env parity
        env:
          RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
        run: |
          set -euo pipefail

          # Read each service's variables once. A CLI/auth/network failure here
          # fails the deploy loudly instead of silently skipping the check.
          api_vars="$(railway variable list --service "$RAILWAY_API_SERVICE_ID" --kv)"
          mcp_vars="$(railway variable list --service "$RAILWAY_MCP_SERVICE_ID" --kv)"

          extract() {
            # $1 = dotenv blob, $2 = key; prints the raw value or empty if unset.
            printf '%s\n' "$1" | grep -E "^$2=" | head -n1 | cut -d= -f2- || true
          }

          api_issuer="$(extract "$api_vars" OAUTH_ISSUER)"

          # Guard: only assert once the api AS issuer is configured. While fully
          # dark (issuer empty/unset) OAuth is off, so never block the deploy.
          if [ -z "$api_issuer" ]; then
            echo "OAUTH_ISSUER is empty on the api service — OAuth is dark; skipping parity check."
            exit 0
          fi

          mcp_issuer="$(extract "$mcp_vars" MCP_OAUTH_ISSUER)"
          api_resource="$(extract "$api_vars" MCP_RESOURCE_URL)"
          mcp_resource="$(extract "$mcp_vars" MCP_RESOURCE_URL)"

          # The api mints these values VERBATIM as the JWT aud/iss, while the RS
          # (apps/mcp) normalizes its own copy (strips trailing slashes) before
          # exact-matching. So a trailing slash on BOTH sides byte-equals here yet
          # still makes the RS reject every token. Reject any slash outright — the
          # canonical form is slashless — rather than normalize-then-compare.
          reject_trailing_slash() {
            # $1 = label, $2 = value
            case "$2" in
              */)
                echo "::error::$1 has a trailing slash ('$2') — OAUTH_ISSUER/MCP_RESOURCE_URL are used verbatim as JWT aud/iss and must be canonical (no trailing slash), or the RS rejects every OAuth token."
                exit 1
                ;;
            esac
          }

          reject_trailing_slash "api OAUTH_ISSUER" "$api_issuer"
          reject_trailing_slash "mcp MCP_OAUTH_ISSUER" "$mcp_issuer"
          reject_trailing_slash "api MCP_RESOURCE_URL" "$api_resource"
          reject_trailing_slash "mcp MCP_RESOURCE_URL" "$mcp_resource"

          drift=0
          if [ "$mcp_issuer" != "$api_issuer" ]; then
            echo "::error::OAuth issuer drift: mcp MCP_OAUTH_ISSUER='$mcp_issuer' != api OAUTH_ISSUER='$api_issuer'"
            drift=1
          fi
          if [ "$mcp_resource" != "$api_resource" ]; then
            echo "::error::Resource URL drift: mcp MCP_RESOURCE_URL='$mcp_resource' != api MCP_RESOURCE_URL='$api_resource'"
            drift=1
          fi

          if [ "$drift" -ne 0 ]; then
            echo "::error::OAuth env parity check failed — the RS would reject every OAuth token while API keys keep working. Fix the Railway vars before deploying."
            exit 1
          fi

          echo "OAuth env parity OK: issuer='$api_issuer' resourceUrl='$api_resource'"

      - name: Deploy to Railway
        run: sh .github/scripts/railway-deploy.sh "$RAILWAY_MCP_SERVICE_ID"
