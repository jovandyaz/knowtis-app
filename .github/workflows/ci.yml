name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # Filters the PR's base branch, so stacked PRs need their parent's prefix listed here.
    branches:
      - main
      - develop
      - feat/**
      - fix/**
      - docs/**
      - chore/**
      - refactor/**
      - test/**
      - build/**
      - ci/**
      - perf/**
      - style/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    outputs:
      api_affected: ${{ steps.check-api.outputs.affected }}
      notes_affected: ${{ steps.check-notes.outputs.affected }}
      mcp_affected: ${{ steps.check-mcp.outputs.affected }}
      backoffice_affected: ${{ steps.check-backoffice.outputs.affected }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: main

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (affected)
        run: npx nx affected -t lint

      - name: Typecheck (affected)
        run: npx nx affected -t typecheck

      - name: Test (affected)
        # --parallel=2 bounds concurrent vitest projects; 3+ NestJS/jsdom
        # suites at once exceed hosted-runner memory and get OOM-killed.
        run: npx nx affected -t test --parallel=2 -- --run

      - name: Check for missing DB migrations
        run: |
          npx nx db:generate api
          if ! git diff --exit-code -- apps/api/drizzle/; then
            echo "::error::Schema changes detected without a corresponding migration file."
            echo "::error::Run 'pnpm nx db:generate api' locally and commit the generated files."
            exit 1
          fi

      - name: Build (affected)
        run: npx nx affected -t build --configuration=production

      - name: Check if API is affected
        id: check-api
        run: |
          if npx nx show projects --affected --type app | grep -q '^api$'; then
            echo "affected=true" >> $GITHUB_OUTPUT
          else
            echo "affected=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if Notes is affected
        id: check-notes
        run: |
          if npx nx show projects --affected --type app | grep -q '^notes$'; then
            echo "affected=true" >> $GITHUB_OUTPUT
          else
            echo "affected=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if MCP is affected
        id: check-mcp
        run: |
          if npx nx show projects --affected --type app | grep -q '^mcp$'; then
            echo "affected=true" >> $GITHUB_OUTPUT
          else
            echo "affected=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if Backoffice is affected
        id: check-backoffice
        run: |
          if npx nx show projects --affected --type app | grep -q '^backoffice$'; then
            echo "affected=true" >> $GITHUB_OUTPUT
          else
            echo "affected=false" >> $GITHUB_OUTPUT
          fi

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [ci]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.ci.outputs.notes_affected == 'true'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  deploy-backoffice:
    name: Deploy Backoffice to Vercel
    runs-on: ubuntu-latest
    needs: [ci]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.ci.outputs.backoffice_affected == 'true'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKOFFICE }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        run: vercel build --prod --local-config=apps/backoffice/vercel.json --token=$VERCEL_TOKEN

      - name: Deploy
        run: vercel deploy --prebuilt --prod --local-config=apps/backoffice/vercel.json --token=$VERCEL_TOKEN

  deploy:
    name: Deploy API to Railway
    runs-on: ubuntu-latest
    needs: [ci]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.ci.outputs.api_affected == 'true'
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to Railway
        run: railway up --service ${{ vars.RAILWAY_SERVICE_ID }}

  deploy-mcp:
    name: Deploy MCP to Railway
    runs-on: ubuntu-latest
    needs: [ci]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.ci.outputs.mcp_affected == 'true' &&
      vars.RAILWAY_MCP_SERVICE_ID != ''
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_MCP_SERVICE_ID: ${{ vars.RAILWAY_MCP_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Pin service variables
        run: railway variable set "NODE_ENV=production" "MCP_ALLOWED_HOSTS=mcp.knowtis.app" --service "$RAILWAY_MCP_SERVICE_ID" --skip-deploys

      - name: Assert OAuth env parity
        env:
          RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
        run: |
          set -euo pipefail

          # Read each service's variables once. A CLI/auth/network failure here
          # fails the deploy loudly instead of silently skipping the check.
          api_vars="$(railway variable list --service "$RAILWAY_API_SERVICE_ID" --kv)"
          mcp_vars="$(railway variable list --service "$RAILWAY_MCP_SERVICE_ID" --kv)"

          extract() {
            # $1 = dotenv blob, $2 = key; prints the raw value or empty if unset.
            printf '%s\n' "$1" | grep -E "^$2=" | head -n1 | cut -d= -f2- || true
          }

          api_issuer="$(extract "$api_vars" OAUTH_ISSUER)"

          # Guard: only assert once the api AS issuer is configured. While fully
          # dark (issuer empty/unset) OAuth is off, so never block the deploy.
          if [ -z "$api_issuer" ]; then
            echo "OAUTH_ISSUER is empty on the api service — OAuth is dark; skipping parity check."
            exit 0
          fi

          mcp_issuer="$(extract "$mcp_vars" MCP_OAUTH_ISSUER)"
          api_resource="$(extract "$api_vars" MCP_RESOURCE_URL)"
          mcp_resource="$(extract "$mcp_vars" MCP_RESOURCE_URL)"

          # The api mints these values VERBATIM as the JWT aud/iss, while the RS
          # (apps/mcp) normalizes its own copy (strips trailing slashes) before
          # exact-matching. So a trailing slash on BOTH sides byte-equals here yet
          # still makes the RS reject every token. Reject any slash outright — the
          # canonical form is slashless — rather than normalize-then-compare.
          reject_trailing_slash() {
            # $1 = label, $2 = value
            case "$2" in
              */)
                echo "::error::$1 has a trailing slash ('$2') — OAUTH_ISSUER/MCP_RESOURCE_URL are used verbatim as JWT aud/iss and must be canonical (no trailing slash), or the RS rejects every OAuth token."
                exit 1
                ;;
            esac
          }

          reject_trailing_slash "api OAUTH_ISSUER" "$api_issuer"
          reject_trailing_slash "mcp MCP_OAUTH_ISSUER" "$mcp_issuer"
          reject_trailing_slash "api MCP_RESOURCE_URL" "$api_resource"
          reject_trailing_slash "mcp MCP_RESOURCE_URL" "$mcp_resource"

          drift=0
          if [ "$mcp_issuer" != "$api_issuer" ]; then
            echo "::error::OAuth issuer drift: mcp MCP_OAUTH_ISSUER='$mcp_issuer' != api OAUTH_ISSUER='$api_issuer'"
            drift=1
          fi
          if [ "$mcp_resource" != "$api_resource" ]; then
            echo "::error::Resource URL drift: mcp MCP_RESOURCE_URL='$mcp_resource' != api MCP_RESOURCE_URL='$api_resource'"
            drift=1
          fi

          if [ "$drift" -ne 0 ]; then
            echo "::error::OAuth env parity check failed — the RS would reject every OAuth token while API keys keep working. Fix the Railway vars before deploying."
            exit 1
          fi

          echo "OAuth env parity OK: issuer='$api_issuer' resourceUrl='$api_resource'"

      - name: Deploy to Railway
        run: railway up --service "$RAILWAY_MCP_SERVICE_ID"
