name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    outputs:
      api_affected: ${{ steps.check-api.outputs.affected }}
      notes_affected: ${{ steps.check-notes.outputs.affected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (affected)
        run: npx nx affected -t lint

      - name: Typecheck (affected)
        run: npx nx affected -t typecheck

      - name: Test (affected)
        run: npx nx affected -t test -- --run

      - name: Build (affected)
        run: npx nx affected -t build --configuration=production

      - name: Check if API is affected
        id: check-api
        run: |
          if npx nx show projects --affected --type app | grep -q '^api$'; then
            echo "affected=true" >> $GITHUB_OUTPUT
          else
            echo "affected=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if Notes is affected
        id: check-notes
        run: |
          if npx nx show projects --affected --type app | grep -q '^notes$'; then
            echo "affected=true" >> $GITHUB_OUTPUT
          else
            echo "affected=false" >> $GITHUB_OUTPUT
          fi

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [ci]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.ci.outputs.notes_affected == 'true'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: [ci]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.ci.outputs.api_affected == 'true'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        run: pnpm nx db:migrate api

  deploy:
    name: Deploy API to Railway
    runs-on: ubuntu-latest
    needs: [ci, migrate]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.ci.outputs.api_affected == 'true'
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        run: railway up --service ${{ vars.RAILWAY_SERVICE_ID }}
